[build]
base = "."
command = "npm run build"
publish = "client/dist/exin-client/browser"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22.23.3"
NPM_FLAGS = "--include=optional"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/portfolio"
to = "/.netlify/functions/portfolio"
status = 200

[[redirects]]
from = "/api/health"
to = "/.netlify/functions/health"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
